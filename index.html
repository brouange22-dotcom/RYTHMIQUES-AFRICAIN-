:root{--bg:#F5F0FA;--ink:#2A1233;--soft:#6A5778;--a:#C27A00;--b:#0E8077;--card:#FFFFFF;--line:#D9CCE6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B0F24;--ink:#F6EEF9;--soft:#B7A4C4;--a:#F2A900;--b:#2FC4B8;--card:#291736;--line:#43295A}}
:root[data-theme="dark"]{--bg:#1B0F24;--ink:#F6EEF9;--soft:#B7A4C4;--a:#F2A900;--b:#2FC4B8;--card:#291736;--line:#43295A}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;margin:32px 0 12px}
.lead{color:var(--soft);max-width:34em;margin:0 0 20px}
a{color:inherit}
.ring{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ring svg{width:min(100%,280px);height:auto}
.ring p{margin:0;font-size:.92rem;color:var(--soft);text-align:center;max-width:30em}
button{font:inherit;cursor:pointer}
.play{background:var(--a);color:#1B0F24;border:0;border-radius:999px;padding:10px 22px;font-weight:600}
.play:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px}
.chip[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:#fff}
.list{margin-top:12px}
.card{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--line)}
.card h3{margin:0;font-size:1.2rem}
.card span{color:var(--soft);font-size:.92rem}
.card:hover h3{color:var(--a)}
.back{display:inline-block;margin-bottom:18px;font-weight:600;color:var(--b)}
.tag{color:var(--a);font-weight:600;margin:0 0 18px}
dl{margin:20px 0;border-top:1px solid var(--line)}
dl div{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
dt{flex:0 0 120px;color:var(--soft);font-weight:600}
dd{margin:0}
.txt{font-size:1.08rem;max-width:34em}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;font-weight:600}
footer{margin-top:36px;color:var(--soft);font-size:.9rem}
.by{color:var(--a);font-weight:600;margin:0 0 20px}
.note{color:var(--soft);font-style:italic;margin-top:24px}
.src{padding-left:20px;font-size:.95rem}

["dununba","Dununba",0,"Guinée, Mali","Tradition ancienne","Djembé, trois dunun, cloches","Rythme emblématique des Mandingues, joué par trois dunun de tailles différentes qui dialoguent avec le djembé. On le présente souvent comme la danse des hommes forts.","Mamady Keïta"],
["highlife","Highlife",0,"Ghana, Nigeria","Début du XXe siècle","Guitares, cuivres, percussions","Né sur la côte ouest-africaine, il associe mélodies de guitare, cuivres et percussions locales. Il accompagne les fêtes et les clubs, d’Accra à Lagos.","E. T. Mensah, Osita Osadebe"],
["afrobeat","Afrobeat",0,"Nigeria","Fin des années 1960","Batterie, cuivres, claviers, percussions","Fela Kuti le développe en mêlant highlife, jazz, funk et percussions yoruba. Ses morceaux sont longs, hypnotiques, et portent souvent un message politique.","Fela Kuti, Tony Allen"],

["zouglou","Zouglou",0,"Côte d’Ivoire","Années 1990","Voix, guitare, percussions","Musique d’étudiants née à Abidjan, qui raconte la vie avec humour.","Les Parents du Campus, Magic System, Yodé et Siro"],

["gelede","Gèlèdè",0,"Nigeria, Bénin, Togo","Depuis plus d’un siècle","Tambours, orchestre, chants","Cérémonie yoruba-nago de masques, de chants et de danses qui honore la mère primordiale et les femmes.","Troupes gèlèdè yoruba-nago"],

["balafon-senoufo","Balafon sénoufo (ncegele)",0,"Côte d’Ivoire, Mali, Burkina Faso","Tradition sénoufo","Balafon à calebasses, baguettes","Xylophone pentatonique des communautés sénoufo, qui accompagne fêtes, rites et funérailles.","Communautés sénoufo"],

["kete","Kete",0,"Ghana (Akan, Asante)","Tradition de cour","Tambours, cloches, flûtes, voix","Ensemble de tambours des cours des chefs akan, joué aux funérailles royales et lors d’événements d’État.","Ensembles de cour akan"],
["fontomfrom","Fontomfrom",0,"Ghana (Akan)","Tradition de cour","Fontomfrom, atumpan, tambours","Grand ensemble de tambours d’État des cours akan, qui annonce la présence d’une personne importante.","Ensembles de cour akan"],
["abissa","Abissa et tam-tam sacré",0,"Côte d’Ivoire (N’zima, Grand-Bassam)","Tradition n’zima","Tam-tam sacré Edo-N’Gbolè, tambours, sifflets","Fête du nouvel an des N’zima, d’origine akan, ouverte par le tam-tam sacré. C’est une fête et une danse, pas un rythme isolé.","Peuple n’zima kotoko"],
["rumba","Rumba congolaise",1,"RDC, Congo-Brazzaville","XXe siècle","Guitares, voix, section rythmique","Née dans la région du fleuve Congo, elle mêle traditions locales et influences cubaines. Elle est inscrite au patrimoine culturel immatériel de l’UNESCO depuis 2021.","Grand Kallé, Franco"],
["soukous","Soukous",1,"RDC","Années 1960–80","Guitares, basse, batterie","Dérivé de la rumba, il accélère le tempo et met en avant des guitares aux motifs rapides. Il a fait danser toute l’Afrique, puis les clubs d’Europe.","Kanda Bongo Man, Tabu Ley Rochereau"],
["makossa","Makossa",1,"Cameroun","Années 1960–70","Basse, guitares, cuivres, batterie","Style de Douala porté par une basse dansante et des cuivres. Le titre « Soul Makossa » de Manu Dibango (1972) l’a fait connaître au-delà de l’Afrique.","Manu Dibango, Petit Pays"],
["taarab","Taarab",2,"Zanzibar, côte swahilie","Fin du XIXe siècle","Oud, qanûn, violons, percussions","Musique swahilie qui mêle influences arabes, indiennes et africaines. Les paroles poétiques parlent souvent d’amour et de la vie quotidienne.","Siti binti Saad, Bi Kidude"],
["benga","Benga",2,"Kenya","Années 1950–60","Guitares, basse, percussions","Style des Luo, qui repose sur des guitares rapides et des motifs répétés. On l’associe aux orchestres de Nairobi et de la région du lac Victoria.","D. O. Misiani"],
["ethiojazz","Éthio-jazz",2,"Éthiopie","À partir des années 1960","Vibraphone, orgue, cuivres, percussions","Mulatu Astatke l’a imaginé en combinant jazz, rythmes latins et gammes traditionnelles éthiopiennes. Le résultat est un son à la fois planant et dansant.","Mulatu Astatke, Hailu Mergia"],
["mbaqanga","Mbaqanga",3,"Afrique du Sud","Années 1960","Guitare, basse, saxophone, voix","Né dans les townships, il mélange mélodies zouloues, jazz et rythmes urbains. Les chœurs de voix et la basse y tiennent une place centrale.","Mahlathini et les Mahotella Queens"],
["gqom","Gqom",3,"Afrique du Sud (Durban)","Années 2010","Boîtes à rythmes, ordinateur","Né à Durban, il se caractérise par des rythmes sombres, minimalistes et très percussifs, faits pour la danse. Il se fabrique surtout sur ordinateur.","Distruction Boyz, DJ Lag"],
["gnawa","Gnawa",4,"Maroc","Tradition ancienne","Guembri, qraqeb, voix","Musique de transe rituelle issue des confréries gnaoua. Elle repose sur un luth basse, des castagnettes métalliques et des chants répétés.","Maâlem Mahmoud Guinia"],
["rai","Raï",4,"Algérie (Oran)","XXe siècle","Voix, synthétiseur, percussions","Chanson populaire née dans l’ouest algérien, longtemps jouée dans les cabarets. Elle est devenue connue dans le monde entier dans les années 1980–90.","Cheb Khaled, Cheb Mami"]

var H={
adowa:"L’adowa est une danse et une musique très répandues chez les Akan, notamment les Asante du Ghana. Elle est jouée lors de funérailles et d’événements sociaux publics. Le mot adowa désigne l’antilope royale en twi asante : selon un récit oral, la danse serait née de l’imitation des mouvements de cet animal. Les chercheurs l’étudient de près, notamment Kwabena Nketia dans Folk Songs of Ghana (1963).",
kete:"Le kete est un ensemble de tambours et de cloches associé aux chefs traditionnels akan du sud du Ghana. Il appartient au chef, et on ne le joue qu’avec sa permission. Selon la tradition asante, il est associé à Osei Tutu, fondateur du royaume asante. Il est joué lors de funérailles royales et d’événements de cour, et comprend traditionnellement trois sections : tambours, flûtes et voix.",
fontomfrom:"Le fontomfrom est l’un des grands ensembles de tambours d’État des cours akan. Selon le Grinnell College, c’est un ensemble purement instrumental qui, joué sur place ou en procession, signale à tous la présence d’une personne importante. Il comprend une paire de tambours fontomfrom, des atumpan et plusieurs tambours plus petits. Selon Wikipédia, le tambour en sablier fontomfrom est d’origine bono.",
abissa:"L’Abissa est la fête traditionnelle du peuple n’zima, issu du groupe akan, célébrée chaque année entre octobre et novembre à Grand-Bassam. Elle s’ouvre par la remise du tam-tam sacré Edo-N’Gbolè, sorti de la forêt, au roi des N’zima kotoko ; en 2026, cette remise a eu lieu le 1er novembre. Selon une tradition orale, la fête trouve son origine dans l’histoire d’une femme de la famille N’Vavilé qui, instruite par des génies, aurait trouvé une solution à une famine. La famille M’Vavilé est dépositaire de l’Abissa et du tam-tam sacré.",
gelede:"Le Gèlèdè est pratiqué par la communauté yoruba-nago, répartie entre le Bénin, le Nigeria et le Togo. Selon l’UNESCO, cette cérémonie rend hommage depuis plus d’un siècle à la mère primordiale, Iyà Nlà, et au rôle des femmes dans l’organisation de la société yoruba. Elle se déroule la nuit sur une place publique : les chanteurs et un tambourinaire apparaissent d’abord, avec un orchestre, puis viennent les danseurs masqués.",
tchinkoume:"Le tchinkoumé (écrit aussi tchinkoumin, tchingounmin ou tchinkounmè) est un rythme traditionnel du Bénin. Selon plusieurs sources, il est lié au pays mahi, dans le centre du pays, autour de Savalou, et servait à l’origine aux cérémonies funéraires. Il est devenu ensuite aussi une musique de fête. Dans les années 1980, l’artiste Tohon Stan l’a modernisé avec des instruments électriques : c’est le Tchink System.",
"balafon-senoufo":"Le balafon des communautés sénoufo du Mali, du Burkina Faso et de la Côte d’Ivoire est un xylophone pentatonique appelé localement ncegele. Selon l’UNESCO, il rythme la vie des communautés : il accompagne des rites agricoles et des cérémonies d’initiation, anime les fêtes, accompagne des prières, notamment dans les bois sacrés, encourage au travail et ponctue la musique funéraire. L’apprenti commence sur un balafon d’enfant, puis passe à un instrument de taille normale auprès d’un maître.",
zaouli:"Le zaouli appartient aux Gouro, une communauté du centre de la Côte d’Ivoire. C’est une danse et une musique portées par un masque, dont le danseur exécute des pas incroyablement rapides sur des rythmes de tambours. Il est joué lors de fêtes et de cérémonies. L’UNESCO l’a inscrit à son patrimoine culturel immatériel en 2017.",
ziglibithy:"Le ziglibithy est créé dans les années 1970 par Ernesto Djédjé, originaire de Gagnoa. Il s’inspire des rythmes traditionnels bété et les joue avec des guitares électriques et une batterie. Djédjé le fait connaître dans toute la Côte d’Ivoire : c’est l’une des musiques ivoiriennes les plus marquantes de cette époque.",
zouglou:"Le zouglou naît en 1990 sur le campus de l’université d’Abidjan, créé par des étudiants. Ils chantent en groupe, avec des voix, des percussions et parfois une guitare, des textes humoristiques sur la vie quotidienne, les difficultés des étudiants et la société. Des groupes comme Les Parents du Campus, puis Magic System et Yodé et Siro, le font connaître dans le pays et au-delà.",
"coupe-decale":"Le coupé-décalé apparaît au début des années 2000 dans les clubs de Paris, au sein de la diaspora ivoirienne. Douk Saga et ses amis le lancent comme une musique de fête, avec des pas de danse faciles à imiter. Il revient ensuite à Abidjan et devient très populaire en Afrique de l’Ouest, avec des artistes comme DJ Arafat.",
dununba:"Le dununba vient du monde mandingue, une vaste zone d’Afrique de l’Ouest liée à l’ancien empire du Mali. Il se joue pour des fêtes et des cérémonies, et met en avant la force et le courage. Au XXe siècle, des ensembles comme les Ballets africains de Guinée ont fait connaître le djembé et ces rythmes à l’étranger. Aujourd’hui, des percussionnistes comme Mamady Keïta les enseignent dans le monde entier.",
highlife:"Le highlife apparaît sur la côte du Ghana au début du XXe siècle, quand les guitares, les fanfares et les chants locaux se rencontrent. Son nom évoque les clubs où l’élite venait danser. Dans les années 1950, E. T. Mensah, surnommé le roi du highlife, le rend très populaire. Il gagne ensuite le Nigeria, où il inspire de nombreux orchestres, et il sert de base à l’afrobeat.",
afrobeat:"Fela Kuti naît en 1938 au Nigeria. Après des études de musique à Londres, il découvre à Los Angeles, en 1969, les idées du mouvement noir américain. De retour à Lagos, il invente l’afrobeat avec le batteur Tony Allen. Ses concerts, au club le Shrine, durent des heures. Ses paroles critiquent le pouvoir et les injustices, et son influence dépasse aujourd’hui largement le Nigeria.",
mbalax:"Dans les années 1960, la musique afro-cubaine est très écoutée à Dakar. Peu à peu, des musiciens sénégalais se tournent vers leurs propres traditions, en particulier le sabar, le tambour des fêtes wolof. Dans les années 1970-80, des groupes comme l’Étoile de Dakar de Youssou N’Dour mêlent ces tambours à des guitares et des claviers électriques : c’est le mbalax, mot qui désigne à l’origine l’accompagnement rythmique.",
rumba:"À partir des années 1930-40, des disques cubains circulent à Kinshasa et Brazzaville et se mêlent aux rythmes locaux de chaque côté du fleuve Congo. Dans les années 1950-60, des orchestres comme African Jazz de Grand Kallé et l’OK Jazz de Franco la rendent immensément populaire. En 1960, « Indépendance Cha Cha » accompagne l’indépendance du Congo. L’UNESCO a inscrit la rumba congolaise à son patrimoine immatériel en 2021.",
soukous:"Le mot vient du français « secouer ». Dans les années 1960-70, des musiciens comme Tabu Ley Rochereau et Dr Nico transforment la rumba, avec un tempo plus rapide et des guitares plus brillantes. Le sebene, longue partie de guitare propice à la danse, en devient la marque. Dans les années 1980, de nombreux artistes s’installent à Paris et font connaître le soukous en Europe.",
makossa:"Le makossa naît à Douala, dans la communauté duala, et son nom évoque la danse. Dans les années 1960-70, des artistes comme Eboa Lotin lui donnent sa forme moderne. En 1972, « Soul Makossa » de Manu Dibango devient un succès à New York. Son refrain sera repris plus tard par Michael Jackson dans « Wanna Be Startin’ Somethin’ ».",
taarab:"Le taarab naît à Zanzibar à la fin du XIXe siècle. Le sultan Barghash encourage une musique de cour inspirée de l’Égypte, qui se mêle ensuite aux traditions swahilies et indiennes. Son nom vient d’un mot arabe qui désigne l’émotion que provoque la musique. Dans les années 1920, la chanteuse Siti binti Saad enregistre en swahili et devient la première grande voix du genre.",
benga:"Le benga naît chez les Luo, près du lac Victoria, dans les années 1950-60. Des guitaristes y adaptent à la guitare les motifs du nyatiti, la lyre traditionnelle luo. Le style est ensuite repris à Nairobi. D. O. Misiani et son groupe Shirati Jazz en sont des figures majeures, avec des paroles qui commentent la vie sociale et politique.",
ethiojazz:"Mulatu Astatke, né à Jimma en 1943, étudie la musique à Londres puis aux États-Unis, où il découvre le jazz et les rythmes latins. De retour à Addis-Abeba, il les associe aux modes éthiopiens, des gammes à cinq notes comme le tezeta ou l’ambassel. La série de disques Éthiopiques et le film « Broken Flowers » (2005) ont fait découvrir ce son au monde entier.",
mbaqanga:"Le mbaqanga naît dans les townships de Johannesburg dans les années 1960, à partir du marabi, du jazz et des mélodies zouloues. Son nom est un mot zoulou qui désigne un pain cuit à la vapeur. Sous l’apartheid, cette musique urbaine accompagne la vie quotidienne des townships. Mahlathini, surnommé le Lion de Soweto, et les Mahotella Queens l’ont fait connaître bien au-delà de l’Afrique du Sud.",
gqom:"Le gqom apparaît au début des années 2010 dans les townships de Durban, comme Umlazi. De jeunes producteurs fabriquent des rythmes sur ordinateur avec des logiciels accessibles et les partagent par téléphone. Le mot vient du zoulou et évoque le tambour ou le choc. Sa basse lourde et son rythme sec ont ensuite voyagé jusque dans les clubs du monde entier.",
gnawa:"Les Gnawa sont des confréries du Maroc, descendantes de personnes d’Afrique subsaharienne amenées de force au Maghreb. Leur musique sert dans la lila, une cérémonie de nuit, de transe et de guérison, qui mêle héritages africains et spiritualité soufie. Elle se joue en cycles, avec couleurs, encens et danses. Depuis 1998, le festival d’Essaouira lui donne une grande scène.",
rai:"Le mot raï signifie « opinion » en arabe. Il naît autour d’Oran, dans les chants des bergers et des cheikhat, chanteuses populaires comme Cheikha Rimitti, qui abordent sans détour la vie, l’amour et la liberté. Dans les années 1970-80, les jeunes y ajoutent synthétiseurs et boîtes à rythmes. Cheb Khaled et Cheb Mami le font connaître dans le monde entier."};
var S={
adowa:"Chez les Akan, l’adowa accompagne le deuil : on porte traditionnellement du rouge et du noir aux funérailles. Selon une étude universitaire, il exprime aussi l’identité asante. Dans la danse, certains gestes expriment des émotions, comme la douleur lors d’un enterrement.",
kete:"Le kete est la musique du pouvoir et de la mémoire royale : il accompagne les funérailles royales et honore les chefs. Son accès est contrôlé : on ne le joue qu’avec l’accord du chef.",
fontomfrom:"Le fontomfrom marque la présence du pouvoir : il accompagne les cérémonies en l’honneur des chefs et les processions royales. Selon les sources, il sert aussi à transmettre des messages et des proverbes.",
abissa:"Pour les N’zima, l’Abissa est un temps de pardon, de solidarité et de cohésion sociale. Selon un site d’information, elle est dédiée à Nyamie, la divinité suprême des Akan : cette dimension relève des croyances du peuple n’zima.",
gelede:"Selon l’UNESCO, le Gèlèdè est la seule société de masques connue qui soit aussi dirigée par des femmes. Pour les pratiquants, il s’agit d’honorer le pouvoir spirituel des « mères » et d’apaiser la communauté. Ces croyances relèvent de la tradition yoruba.",
tchinkoume:"Dans la tradition mahi, le rythme accompagne le deuil et vise à chasser le mauvais sort après un décès, selon les sources consultées. Cette dimension relève des croyances des communautés.",
"balafon-senoufo":"Selon l’UNESCO, le balafon donne le rythme de la vie des communautés sénoufo et transmet un système de valeurs. Il donne à chacun, des plus jeunes aux plus âgés, un sentiment d’identité et de continuité.",
zaouli:"Dans la tradition gouro, le masque n’est pas un simple costume : il porte une histoire et un rôle dans la communauté. La danse est vécue comme un moment de beauté, de fierté et de transmission entre générations.",
ziglibithy:"Le ziglibithy a donné à la jeunesse ivoirienne une musique moderne tout en gardant des racines bété. C’est une façon de faire entendre les traditions dans un son nouveau.",
zouglou:"Le zouglou est une musique de parole : on y raconte la vie, on dénonce des injustices et on rit ensemble des difficultés du quotidien. C’est un espace d’expression pour la jeunesse.",
"coupe-decale":"Musique de fête et de joie, le coupé-décalé a aussi été un moyen de se retrouver et d’exprimer sa fierté ivoirienne. Ses danses se partagent facilement, ce qui en fait un langage commun pour la jeunesse.",
dununba:"Dans les sociétés mandingues, le djembé et les dunun accompagnent initiations, mariages et récoltes. Le rythme y est un langage partagé : il rassemble la communauté et transmet des valeurs comme la force et le courage.",
highlife:"Ce n’est pas une musique rituelle, mais une musique de fête, de rencontre et d’identité. Au Ghana, elle a accompagné l’époque de l’indépendance, en 1957.",
afrobeat:"C’est avant tout une musique de résistance et de prise de parole. Fela Kuti a nommé son club le Shrine, un mot qui évoque les lieux sacrés, et il s’est réclamé des spiritualités africaines traditionnelles.",
mbalax:"Le sabar rythme traditionnellement les baptêmes, les mariages et les fêtes de quartier au Sénégal. Ses tambours « parlent » : certains rythmes servent à saluer, à appeler ou à honorer une personne.",
rumba:"La rumba parle d’amour, de vie quotidienne et de liberté. Autour des indépendances, elle est devenue un symbole de fierté pour les peuples du Congo.",
soukous:"Musique de joie et de danse, elle rassemble les gens autour de la fête. Son énergie est avant tout sociale : elle fait danser et se retrouver.",
makossa:"Musique de danse et de fête urbaine, elle a donné une voix à la vie des quartiers de Douala. Elle célèbre le plaisir de se retrouver et de danser ensemble.",
taarab:"Le taarab est joué surtout lors des mariages et des fêtes à Zanzibar et sur la côte swahilie. Ses poèmes chantés transmettent des conseils, des émotions et des histoires de la vie quotidienne.",
benga:"Musique de danse et de commentaire social, le benga fait entendre l’humour, les histoires et les préoccupations du quotidien.",
ethiojazz:"Les gammes éthiopiennes qu’il utilise portent des émotions précises : le tezeta, par exemple, évoque la mémoire et la nostalgie. La musique devient un moyen de raconter une identité.",
mbaqanga:"Musique des townships, elle a exprimé la vie quotidienne, la joie et la dignité de ses habitants sous l’apartheid. Les voix y racontent le quotidien et la mémoire collective.",
gqom:"Musique de la jeunesse des townships, le gqom est un espace d’expression et de fête. Elle est née de la débrouillardise : on la crée avec peu de moyens et on la partage ensemble.",
gnawa:"C’est l’une des musiques les plus liées au spirituel. Dans la lila, selon la tradition, on invoque des esprits appelés mlouk, associés à des couleurs, des encens et des danses. Pour les participants, cette musique a une fonction de guérison spirituelle.",
rai:"Le raï est surtout une musique de liberté d’expression : il parle sans détour d’amour et de la vie, parfois de sujets que d’autres chants évitent. Des chanteuses comme Cheikha Rimitti l’ont porté avec courage."};
var D={
adowa:{o:"L’adowa est pratiqué par les Akan du sud du Ghana, qui parlent le twi. D’après le musée royal de l’Afrique centrale, c’est une danse populaire jouée lors de funérailles et d’événements sociaux publics. Un ensemble classique comprend une paire de tambours parleurs atumpan, un tambour ténor (petia), un tambour de soutien (apentemma), un tambour en sablier (donno) et des cloches (dawuro).",f:"À l’origine funéraire, l’adowa exprime le deuil et l’identité asante. Selon un article de presse ghanéen, sa gestuelle a des significations précises : par exemple, les mains derrière le dos ou sur le ventre expriment la douleur lors d’un enterrement.",e:"Le mpre est une forme plus légère de l’adowa, jouée sans les atumpan, d’après les notes d’un disque Folkways ; il est lié aux veillées funéraires. L’adowa a aussi été adopté par d’autres peuples du Ghana : d’après d’autres notes Folkways, les Ga l’ont reçu des Akwamu, un groupe akan, entre 1660 et 1680.",d:"L’origine de la danse est racontée de plusieurs façons. Un récit oral la fait naître de l’imitation de l’antilope royale ; une autre source affirme au contraire que l’antilope n’a aucune signification dans les mouvements. Les sources consultées ne permettent pas de trancher.",s:[["Musée royal de l’Afrique centrale : Adowa dance","https://music.africamuseum.be/instruments/english/ghana/ashanti/adowa.html"],["Metropolitan Museum of Art : Atumpan","https://www.metmuseum.org/art/collection/search/501976"],["Katherine Moss, Adowa: Funeral Dance of Asante as a Vehicle to Express Ethnic Identity (1998)","https://digitalcollections.sit.edu/african_diaspora_isp/62"],["Graphic Online : Ghanaian traditional dances","https://www.graphic.com.gh/features/features/ghanaian-traditional-dances-histories-buried-in-body-movements.html"],["Smithsonian Folkways : notes sur la musique ashanti","https://folkways-media.si.edu/docs/folkways/artwork/FW04240.pdf"],["Smithsonian Folkways : notes sur la musique ga","https://folkways-media.si.edu/docs/folkways/artwork/FW04291.pdf"],["Université d’Alberta : principes d’intégration rythmique","https://sites.ualberta.ca/~michaelf/African%20Music_Site/Rhythm.htm"]]},
kete:{o:"Selon le Grinnell College, l’ensemble kete est associé aux chefs traditionnels des peuples akan du sud du Ghana et leur appartient. L’ancien kete comprend trois sections : tambours, flûtes et voix. D’après les notes Folkways, un ensemble kete peut jouer au moins huit pièces différentes.",f:"Le kete est joué lors des funérailles royales, avec la permission du chef, et lors de grandes occasions d’État. Chaque représentation suit un format traditionnel qui dépend de l’occasion.",e:"Selon le Grinnell College, de nouveaux contextes sociaux sont apparus ces dernières décennies pour cet ensemble. Le chercheur Kwasi Ampene étudie les chants du kete et la poésie des tambours dans Asante Court Music and Verbal Arts in Ghana, livre récompensé du prix Nketia 2022.",d:"Les récits d’origine diffèrent. Une tradition rattache le kete à Osei Tutu, fondateur du royaume asante ; une autre source indique que l’ensemble aurait été pris puis adopté par les Asante lors d’une bataille avec un autre groupe. Les sources consultées ne permettent pas de trancher.",s:[["Grinnell College : Kete Ensemble from Ghana","https://omeka-s.grinnell.edu/s/MusicalInstruments/page/kete"],["Smithsonian Folkways : notes sur la musique ashanti","https://folkways-media.si.edu/docs/folkways/artwork/FW04240.pdf"],["Kwasi Ampene, Asante Court Music and Verbal Arts in Ghana (Routledge)","https://www.routledge.com/9781032235585"]]},
fontomfrom:{o:"Le fontomfrom est présenté par le Grinnell College comme un ensemble royal purement instrumental. Une source en ligne le décrit comme le plus grand et le plus important des orchestres de tambours d’État asante, avec une paire de tambours fontomfrom, les atumpan et plusieurs tambours plus petits.",f:"Il honore les chefs lors de cérémonies et accompagne les processions royales. Selon une thèse sur Aburi-Akuapem, il est joué lors d’un festival, d’un enterrement royal et d’un enterrement non royal.",e:"Selon Wikipédia, le grand tambour unique du début est devenu, avec le temps, un ensemble de plusieurs tambours.",d:"L’origine est discutée. Wikipédia décrit le tambour comme inventé par les Bono, alors que d’autres sources présentent le fontomfrom comme un orchestre d’État asante. Les sources consultées ne permettent pas de trancher.",s:[["Grinnell College : Ghana, ensembles royaux","https://vetter.sites.grinnell.edu/ghana/?p=130"],["Wikipédia : Fontomfrom","https://en.wikipedia.org/wiki/Fontomfrom"],["Thèse : Rhythms of Power, Royal Drumming in Aburi-Akuapem, Ghana","https://ideals.illinois.edu/items/87159"],["Ghana Goods : Ashanti, histoire","https://ghanagoods.co.uk/category/ghana/ghana-culture-history/ashanti"]]},
abissa:{o:"Les N’zima sont un peuple du groupe akan établi au sud-est de la Côte d’Ivoire et dans le sud-ouest du Ghana. Selon un anthropologue cité par Abidjan.net, ils occupaient cet espace avant le tracé des frontières, et l’Abissa se célèbre par vagues successives, du Ghana vers la Côte d’Ivoire, Grand-Bassam étant le dernier village à la célébrer.",f:"L’Abissa est présentée comme une institution sociale de cohésion, de pardon et de solidarité. Elle est aussi décrite comme une fête de remerciement qui honore les ancêtres.",e:"Selon l’agence APA, la fête est proposée pour une inscription au patrimoine culturel immatériel de l’UNESCO. Une étude universitaire (Kadjo et Ezan, 2021) montre aussi des dissensions internes au peuple n’zima dans la pratique de l’Abissa à Grand-Bassam.",d:"Plusieurs récits d’origine circulent. Une source en ligne indique une fondation vers 1800, que nous n’avons pas pu confirmer. L’Abissa est une fête avec danse et tambours : elle ne correspond pas à un seul rythme.",s:[["AIP : ouverture de l’Abissa 2026","https://www.aip.ci/cote-divoire-aip-ceremonie-du-lancement-et-douverture-de-la-semaine-festive-de-labissa-2026/"],["Abidjan.net : Abissa 2026, le tam-tam sacré","https://news.abidjan.net/articles/749851/abissa-2026-edo-ngbole-le-tam-tam-sacre-ouvre-les-portes-des-festivites-publiques-pour-une-semaine"],["Abidjan.net : Les secrets de l’Abissa","https://news.abidjan.net/articles/415766/pont-de-mire-les-secrets-de-labissa-fete-des-nzimah"],["APA News : le festival Abissa","https://fr.apanews.net/culture/rci-le-festival-abissa-enflamme-grand-bassam/"],["Kadjo et Ezan (2021), European Scientific Journal","https://core.ac.uk/download/493003646.pdf"],["Wikipédia : Abissa","https://en.wikipedia.org/wiki/Abissa"]]},
zaouli:{o:"Le zaouli est une musique et une danse populaires des communautés gouro, dans les départements de Bouaflé et de Zuénoula, au centre-ouest de la Côte d’Ivoire. Selon l’UNESCO, il rend hommage à la beauté féminine et s’inspire de deux masques, le Blou et le Djela. Son autre nom, Djela lou Zaouli, signifie « Zaouli, la fille de Djela ». Une seule représentation réunit sculpture (le masque), tissage (le costume), musique (l’orchestre et le chant) et danse.",f:"Selon l’UNESCO, le zaouli joue un rôle éducatif, ludique et esthétique, exprime l’identité culturelle de ses porteurs et favorise l’intégration et la cohésion sociale. D’après Wikipédia, chaque village gouro a son danseur de zaouli, toujours un homme, qui se produit lors de funérailles et de fêtes.",e:"Le zaouli est inscrit depuis 2017 sur la Liste représentative du patrimoine culturel immatériel de l’humanité. Selon l’UNESCO, des spectacles populaires sont organisés deux ou trois fois par semaine par les communautés, et des compétitions et festivals entre villages ainsi que les chefferies traditionnelles soutiennent sa transmission.",d:"L’origine du masque est discutée. Une version courante le dit créé dans les années 1950 et inspiré par une jeune fille d’une grande beauté nommée Djela Lou Zaouli, mais les récits varient et chaque masque peut avoir sa propre histoire. L’UNESCO précise qu’il existe sept types de masques, chacun traduisant une légende précise.",s:[["UNESCO : Zaouli, musique et danse populaires des communautés gouro (inscription 2017)","https://ich.unesco.org/en/RL/zaouli-popular-music-and-dance-of-the-gouro-communities-of-cote-divoire-01255"],["UNESCO : décision 12.COM 11.B.8","https://ich.unesco.org/en/decisions/12.COM/11.B.8"],["Honorat Gilles Kouisoa, Abidjan.net","https://news.abidjan.net/h/630284.html"],["Wikipédia : Zaouli (informations complémentaires)","https://en.wikipedia.org/wiki/Zaouli"]]},
gelede:{o:"Le Gèlèdè est pratiqué par la communauté yoruba-nago établie au Bénin, au Nigeria et au Togo. Il se caractérise par des masques sculptés, des danses et des chants en langue yoruba qui transmettent l’histoire et les mythes du peuple. Une analyse présentée par le musée Carlos (Université Emory) explique son nom par l’idée d’apaiser et de ménager les femmes âgées, appelées « nos mères ».",f:"Il rend hommage aux mères et au rôle des femmes dans l’organisation sociale. Il a lieu chaque année après les récoltes, lors d’événements importants et en cas de sécheresse ou d’épidémie. Les chants mêlent poésie épique et lyrique, ironie et satire, et transmettent un patrimoine oral.",e:"L’UNESCO l’a proclamé chef-d’œuvre du patrimoine oral et immatériel de l’humanité en 2001, puis l’a inscrit en 2008 sur la Liste représentative. Selon l’UNESCO, l’évolution technique fait disparaître peu à peu des savoir-faire traditionnels et le tourisme tend à en faire un produit folklorique, mais la communauté reste très attachée à ce patrimoine.",d:"Certaines sources situent la naissance du festival au début du XIXe siècle, alors que l’UNESCO parle d’une pratique de plus d’un siècle. Le pouvoir spirituel attribué aux « mères » relève des croyances yoruba : il ne doit pas être présenté comme un fait scientifique. Les instruments précis varient selon les communautés et restent à documenter pour cette fiche.",s:[["UNESCO : Gèlèdè (version française)","https://ich.unesco.org/fr/RL/lheritage-oral-gelede-00002"],["UNESCO : Oral heritage of Gelede","https://ich.unesco.org/en/RL/gelede-oral-heritage-00002"],["Carlos Museum (Emory University) sur Google Arts & Culture","https://artsandculture.google.com/asset/efe-gelede-headdress-apasa/wgHgzN1BBenbaQ"],["Babatunde Lawal, The Gelede Spectacle (University of Washington Press, 1996)",null]]},
tchinkoume:{o:"Selon un article de l’agence IPS (1998), le tchinkoumin est un rythme traditionnel de la région centrale du Bénin, à Savalou, qui ne se jouait à l’origine qu’aux cérémonies funéraires, d’après un sage de la ville. D’autres sources le décrivent comme un rythme de funérailles mahi, joué pour chasser le mauvais sort après un décès.",f:"À l’origine, il accompagne le deuil. Il est devenu aussi une musique et une danse de fête. Des chercheurs béninois l’ont étudié comme rythme, danse et chants du pays mahi.",e:"Dans les années 1980, le chanteur Tohon Stan l’a mêlé à des instruments modernes pour créer le Tchink System, présenté en 1998 comme l’un des rares rythmes béninois issus d’un mélange entre instruments traditionnels et modernes. De nombreux artistes béninois l’ont ensuite adopté.",d:"Les sources ne s’accordent ni sur la région d’origine ni sur l’orthographe. Plusieurs le situent chez les Mahi, autour de Savalou (centre du Bénin) ; un site de documentation musicale en ligne le rattache aux communautés fon et goun du sud ; un article universitaire le range parmi les danses de l’aire culturelle adja-tado pratiquées par les Fon et leurs apparentés. Cette fiche le présente donc comme un rythme du Bénin, de tradition mahi selon les sources les plus nombreuses, en attendant des travaux d’ethnomusicologie plus complets. Les instruments exacts restent à documenter, certaines sources évoquant une percussion sur l’eau.",s:[["IPS : Un rythme traditionnel en passe de devenir une danse nationale (1998)","https://ipsnews.net/francais/1998/10/23/musique-benin-un-rythme-traditionnel-en-passe-de-devenir-une-danse-nationale/"],["Sylvie Clerfeuille, Afrisson","https://afrisson.com/?p=9972"],["Étude de l’Université d’Abomey-Calavi sur Zinli, Tchinkounmè et Akonhoun","https://bec.uac.bj/uploads/publication/da7a395e14d46791879f564072693ace.pdf"],["Melodigging : Tchinkoumé","https://www.melodigging.com/genre/tchinkoume"],["Wikipédia : Music of Benin","https://en.wikipedia.org/wiki/Music_of_Benin"]]},
"balafon-senoufo":{o:"Le ncegele est un balafon pentatonique : selon l’UNESCO, l’octave y est divisée en cinq intervalles égaux. Il compte de onze à vingt et une lames de bois montées sur un cadre. Il se joue en solo ou en ensemble, avec un discours musical fondé sur de multiples mélodies rythmiques.",f:"Selon l’UNESCO, il accompagne des événements importants comme les rites agricoles et les cérémonies d’initiation, anime les fêtes, accompagne des prières, stimule l’ardeur au travail et ponctue la musique funéraire. Il sert aussi à enseigner des valeurs, des traditions, des croyances, le droit coutumier et des règles d’éthique.",e:"Les pratiques liées au balafon sénoufo ont été inscrites sur la Liste représentative en 2011 pour le Mali et le Burkina Faso, étendues à la Côte d’Ivoire en 2012, puis intégrées en 2024 à une inscription élargie avec le kolintang d’Indonésie.",d:"Les sources consultées ne datent pas précisément l’origine du balafon sénoufo : elle reste à documenter. D’autres peuples d’Afrique de l’Ouest jouent aussi du balafon, avec des accordages et des usages différents : cette fiche ne concerne que la tradition sénoufo.",s:[["UNESCO : balafon des communautés sénoufo","https://ich.unesco.org/en/RL/00849"],["UNESCO : décision 6.COM 13.29 (2011)","https://ich.unesco.org/en/decisions/6.COM/13.29"],["UNESCO : décision 7.COM 11.21 (2012)","https://ich.unesco.org/en/decisions/7.COM/11.21"],["UNESCO : balafon et kolintang (2024)","https://ich.unesco.org/en/RL/cultural-practices-and-expressions-linked-to-balafon-and-kolintang-in-mali-burkina-faso-cote-d-ivoire-and-indonesia-02131?RL=02131"]]}
